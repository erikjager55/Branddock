name: Content Golden-Sets

# ─────────────────────────────────────────────────────────────────────────────
# Twee jobs, bewust gescheiden (2026-08-16, task golden-set-gate-decouple):
#
#   `deterministic` — key-loos, ~1 min, harde exit-codes. Blokkeert PR's.
#   `live-eval`     — live LLM-generatie + llm-rubric-judges. Nightly only.
#
# Waarom gesplitst: ze zaten in één job, dus élke PR die een prompt-pad raakte
# kleurde rood door een live-eval die structureel onder de drempel zit. PR #173
# is met precies die rode check gemerged — terecht (pre-existing), maar het
# traint mensen om `evaluate` te negeren, en dan ziet niemand de échte
# regressie. Zie gotcha 2026-07-07 ("een gate die al lang rood staat…").
#
# Waarom de drempel NIET verlaagd is: log-analyse over 5 nachten (08/10/13/15/16
# augustus) laat zien dat het geen flake is. Steeds dezelfde cases zakken —
# "Napking SEO-focus extreem" 5/5, "NieuweBrand lege knowledge context",
# "Napking vage brief" en "Better Brands thought-leadership" elk 4/5. Het echte
# niveau is ~50-60%; 70% ligt daar net boven, dus de gate flapt. Dat zijn echte
# bevindingen, geen ruis — ze horen onderzocht, niet weggedrukt. Vastgelegd in
# tasks/golden-set-blogpost-quality.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/studio/prompt-templates/**'
      - 'src/lib/ai/chains/**'
      - 'src/lib/ai/canvas-orchestrator.ts'
      - 'tests/content-golden-sets/**'
      # 2026-07-17 — het LP/web-page-prompt-pad ontbrak hier. `scripts/eval/lp-variant-golden`
      # is juist gebouwd omdat de promptfoo-set een generieke markdown-prompt test en niet
      # `buildLandingPageVariantPrompt` ("regressies in het productie-prompt-pad bleven
      # daardoor onzichtbaar"), maar hij werd nooit ingehaakt — dus bleef dat pad in de
      # praktijk onbewaakt. Bewezen: een PR die de LP-prompt wijzigde was volledig groen
      # terwijl de golden-set 2 FAILs gaf (em-dash-priming, zie de directive-noot).
      - 'src/lib/landing-pages/variant-generator.ts'
      - 'src/lib/ai/locale-instruction.ts'
      - 'src/lib/ai/prompts/geo-directives.ts'
      - 'src/lib/studio/human-voice-directive.ts'
      - 'scripts/eval/lp-variant-golden/**'
      - '.github/workflows/golden-sets.yml'
  workflow_dispatch:
    # Manual trigger voor adhoc baseline-meting (draait beide jobs)
  schedule:
    # Nightly regressie-check tegen latest production prompts
    - cron: '0 3 * * *'

# Limit concurrent runs van golden-sets (cost-control)
concurrency:
  group: golden-sets-${{ github.ref }}
  cancel-in-progress: true

# De live-eval commentte vroeger op PR's; die job draait niet meer op
# pull_request, dus write-rechten op issues/PR's zijn niet langer nodig.
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Deterministische regressie-checks. Geen API-keys, geen flake, snel.
  # Dit is de gate die PR's mag blokkeren.
  # ───────────────────────────────────────────────────────────────────────────
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 22 vereist (file-type@22 transitive dep van promptfoo).
          node-version: 22
          cache: npm

      - run: npm ci

      # 2026-05-19: Prisma Client niet auto-gegenereerd door npm ci (geen
      # postinstall-script in package.json). Smoke-tests importeren
      # `@prisma/client` transitief via `src/lib/prisma.ts`; zonder generate
      # gooien ze "Cannot find module '.prisma/client/default'" en crashen.
      # Schema-only generate (geen DB-connectie nodig) is ~2-3s op CI.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run property-evals smoke (Layer 1 regression check)
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
        run: npx tsx scripts/smoke-tests/property-evals.ts

      - name: Run Plan-and-Solve mock smoke (chain-mechanism regression)
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
        run: npx tsx scripts/smoke-tests/plan-and-solve.ts

      - name: Run Tree-of-Thoughts mock smoke (chain-mechanism regression)
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
        run: npx tsx scripts/smoke-tests/tree-of-thoughts-angles.ts

      # Draait tegen een mock-judge; de key is een placeholder, geen echte call.
      - name: Run position-swap calibration smoke
        env:
          ANTHROPIC_API_KEY: mock
        run: npx tsx scripts/smoke-tests/position-swap-judge.ts

      # Bewaakt het ECHTE productie-prompt-pad voor web-pages
      # (`buildLandingPageVariantPrompt`) — de promptfoo-set in `live-eval` test
      # een generieke markdown-prompt en raakt dit pad niet. Default-modus is
      # deterministisch en key-loos: geen API-kosten, geen flake, harde exit-code.
      # (`--live` doet echte generatie; bewust niet in CI — dat is een adhoc-meting.)
      - name: Run LP-variant golden-set (productie-prompt-pad)
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
        run: npx tsx scripts/eval/lp-variant-golden/run.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Live LLM-eval. Nightly + handmatig — NOOIT op een PR.
  # Faalt nog steeds hard: een rode nightly is een echt signaal, geen ruis.
  # ───────────────────────────────────────────────────────────────────────────
  live-eval:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      (github.repository_owner == 'erikjager55' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Promptfoo installation
        run: npx promptfoo --version

      # De owner-check in de job-`if` bewijst NIET dat het secret gezet is — een
      # lege ANTHROPIC_API_KEY laat de job gewoon draaien, en promptfoo crasht
      # dan "Missing ANTHROPIC_API_KEY" VÓÓR het resultaatbestand, waarna de gate
      # faalt op de afwezige output. Detecteer de key hier en sla eval + gate
      # netjes over als hij ontbreekt.
      - name: Detect LLM keys
        id: keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping live golden-set eval + pass-rate gate. Add the repo secret to re-enable."
          fi

      # Gate design (prompt-audit 2026-06-11 T8): promptfoo's eigen exit-code is
      # per-case strikt (non-zero bij ÉÉN falende case). We slikken die hier in
      # en handhaven de echte gate op de TOTALE pass-rate in de stap hieronder.
      # Een crash levert geen resultaatbestand, waar de gate hard op faalt.
      - name: Run blog-post golden-set (long-form representant)
        if: steps.keys.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p promptfoo-results
          npx promptfoo eval \
            -c tests/content-golden-sets/long-form/blog-post.yaml \
            --output promptfoo-results/blog-post-results.json \
            --no-progress-bar || echo "::notice::promptfoo exited non-zero (per-case failures or crash) — pass-rate gate step decides"

      - name: Enforce golden-set pass-rate threshold (70%)
        if: steps.keys.outputs.present == 'true'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const THRESHOLD = 70;
          const path = 'promptfoo-results/blog-post-results.json';
          if (!fs.existsSync(path)) {
            console.error('::error::Golden-set gate: no results file — promptfoo crashed before producing output.');
            process.exit(1);
          }
          const results = JSON.parse(fs.readFileSync(path, 'utf8'));
          const tests = results.results?.results ?? results.results ?? [];
          const total = tests.length;
          if (total === 0) {
            console.error('::error::Golden-set gate: results file contains zero test cases — eval misconfigured.');
            process.exit(1);
          }
          const passed = tests.filter((t) => t.success || t.passed).length;
          const passRate = Math.round((passed / total) * 100);
          // Welke cases zakken — zonder dit moet je het artefact downloaden om
          // ook maar iets te weten, en dat kon een maand lang niet.
          const failed = tests.filter((t) => !(t.success || t.passed));
          if (failed.length > 0) {
            console.log('Falende cases:');
            for (const t of failed) {
              const label = t.description ?? t.testCase?.description ?? JSON.stringify(t.vars ?? {}).slice(0, 120);
              console.log(`  FAIL  ${label}`);
            }
          }
          if (passRate < THRESHOLD) {
            console.error(`::error::Golden-set gate FAILED: pass-rate ${passed}/${total} (${passRate}%) is below the ${THRESHOLD}% threshold.`);
            process.exit(1);
          }
          console.log(`Golden-set gate passed: ${passed}/${total} (${passRate}%) >= ${THRESHOLD}%.`);
          EOF

      # `always()` zodat het artefact er juist óók is als de gate faalt — dan
      # heb je het nodig. Staat ná de gate zodat diens foutmelding (crash /
      # nul cases / onder de drempel) als eerste in de log landt.
      #
      # 2026-08-16: dit artefact heeft NOOIT bestaan. De map heette
      # `.promptfoo-results/` en `actions/upload-artifact` slaat hidden files
      # (alles achter een punt) standaard over. De stap meldde `success` met
      # alleen een warning in de log ("No files were found with the provided
      # path"), dus niemand merkte het — terwijl het task-file "download het
      # artifact" als eerste diagnose-stap voorschreef. Die stap was dus
      # onuitvoerbaar, en dat is waarom deze taak een maand stil lag. Map
      # hernoemd naar `promptfoo-results/` (geen punt), `include-hidden-files`
      # expliciet aan én `if-no-files-found: error` — zodat een leeg artefact
      # voortaan hard faalt in plaats van stil te slagen.
      - name: Upload golden-set results
        if: always() && steps.keys.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: golden-set-results-${{ github.sha }}
          path: promptfoo-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
