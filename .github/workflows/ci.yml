name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Zonder deze regel geldt GitHub's standaard van 360 minuten. Een stap die
    # hangt in plaats van faalt blokkeert een PR dan zes uur en ziet er intussen
    # uit als "nog niet groen" — niet als storing. Normale duur is 6-7 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 22 vereist door promptfoo transitive dep file-type@22.0.1.
          # Tevens consistent met lokale dev (Node 22+ lockfile-resolution).
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit
        env:
          # Sinds 2026-08-15 past ook de KALE `tsc --noEmit` niet meer in Node's
          # default ~4GB-heap: de brandstyle-stack (#255-#259) duwde 'm eroverheen
          # en de stap viel om met `Ineffective mark-compacts near heap limit`
          # (exit 134). Lokaal viel dat niet op — macOS schaalt de heap mee met
          # het beschikbare RAM, de runner niet.
          #
          # Dezelfde druk verklaart de Vercel-preview die op "Running TypeScript"
          # 45 minuten hing en in een timeout liep: geen typefout, geen trage
          # branch (koud type-checken duurt ~35s), maar geheugen.
          #
          # Runner heeft 16GB, dus 8GB is ruim en consistent met de build-stap.
          #
          # GEMETEN 2026-08-19 (koud, piek-RSS via `/usr/bin/time -l`): de volledige
          # type-check piekt op 4,95 GB, en de app alléén al op 4,12 GB — beide boven
          # Node's default van ~4 GB. Deze bump is dus het eindantwoord, geen TODO.
          # Er is GEEN dominant bestand: het duurste geval leverde na versmalling
          # -2,1% instantiaties. De massa is een brede optelsom, met de gegenereerde
          # Prisma-client als grootste enkele post (451k regels = 37% van alle
          # definitieregels). Volledige meting: tasks/done/build-heap-investigation.md.
          #
          # De config-splitsing van 19-08 verkleint deze piek naar 4,12 GB en HEFT
          # de bump dus niet op — ze koopt marge, geen oplossing. Ook de aparte
          # scripts-stap hieronder krijgt 8 GB: die piekt op 3,39 GB, te dicht op
          # Node's default om er zonder bump op te vertrouwen.
          NODE_OPTIONS: "--max-old-space-size=8192"

      # `tsconfig.json` dekt sinds 19-08 alleen nog de app; scripts/, prisma/ en
      # e2e/ zitten in `tsconfig.scripts.json`. Die 491 bestanden MOETEN hier
      # blijven draaien — zonder deze stap is de splitsing geen verbetering maar
      # dekkingsverlies. Geverifieerd dat beide configs samen exact dezelfde 3241
      # bestanden zien als de config van vóór de splitsing.
      - run: npm run typecheck:scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - run: npm run lint

      # Bewaakt dat elke kleur-utility die de code gebruikt ook echt gegenereerd
      # wordt. src/index.css was tot 18-08 een bevroren artefact; 358 klassen
      # renderden stil niets. ADR 2026-08-18-tailwind-bronpijplijn.
      - run: npm run smoke:css-utilities -- --strict

      # Deterministisch, key-loos en ~2s: bewaakt de regels achter `<html lang>`,
      # die server en client delen. Zie tasks/done/static-rendering-regressie.md.
      - run: npm run smoke:document-lang

      # Van de 78 smoke-/eval-scripts in package.json stonden er op 2026-08-19 maar
      # DRIE in een workflow. De rest bestond wel maar draaide nooit — waaronder
      # guards die juist waren gebouwd nádat er iets stil was misgegaan. Deze stap
      # draait de goedkope, deterministische selectie (geen DB, geen keys).
      # Welke dat zijn en waarom staat in het script.
      #
      # ⚠️ GEMETEN 2026-08-19, ná de groei van 18 naar 119 bewakers: deze stap
      # kost **1m54s in CI** en is daarmee de op één na duurste van de job, ná
      # `npm run build` (2m03s). Lokaal is het 64s; de runner is trager.
      #
      # De uitspraak "aanhaken is bijna gratis" gold bij 18 bewakers en geldt niet
      # meer. Wie er honderd bij wil hangen: meet eerst. De verdeling van de job
      # staat in tasks/weesbewakers-triage.md.
      #
      # Elke bewaker draagt daar een assertie-ondergrens: groen mét te weinig
      # asserties faalt, want dat is hoe een bewaker stil afhaakt zonder het te
      # melden. Nagemeten dat die ondergrens bijt op een bewaker die exit 0 geeft
      # en niets toetst.
      - name: Goedkope bewakers
        run: scripts/ci/run-guards.sh

      - run: npm run build
        env:
          # These env vars must match the required fields in src/lib/env-validation.ts
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          BETTER_AUTH_SECRET: "ci-build-secret-not-real"
          BETTER_AUTH_URL: "http://localhost:3000"
          # Next's build-TS-fase overschrijdt Node's default ~4GB-heap sinds de
          # webpage-builder-rework. De bump blijft nodig — GEMETEN, niet aangenomen.
          #
          # Hypothese tot 18-08 (stond hier als "type-versmalling is de echte
          # oplossing"): de anonieme structurele inferentie over de
          # 22-component-registry. Die is met #295 weg — `buildSpikePuckConfig`
          # heeft nu een benoemd retourtype. Experiment #302 haalde deze bump er
          # daarna af en de stap viel alsnog om, in exact dezelfde fase:
          #
          #   Running TypeScript ...
          #   Mark-Compact 4028.2 (4130.1) -> 4013.4 (4130.9) MB
          #   FATAL ERROR: Ineffective mark-compacts near heap limit
          #
          # De registry-inferentie was dus NIET de oorzaak (of niet de enige).
          #
          # GEMETEN 2026-08-19: zie de check-stap hierboven. Kort — 4,95 GB koude
          # piek, geen dominant bestand, bump is het eindantwoord. ⚠️ Meet je dit
          # zelf na: verwijder ÉLKE *.tsbuildinfo eerst (incremental staat aan, warm
          # meten geeft 15k instantiaties i.p.v. 9,3M) en gebruik piek-RSS, niet
          # `Memory used` uit --extendedDiagnostics — dat is een momentopname ná GC
          # en bewoog tijdens de meting de verkeerde kant op.
          # Runner heeft 16GB.
          NODE_OPTIONS: "--max-old-space-size=8192"

      # ── Chromium voor de browser-checks ───────────────────────────────────
      #
      # Toegevoegd 2026-08-19. Het alternatief was de CSP-sweep naar de e2e-job
      # verplaatsen, maar die draait `npm run dev` terwijl de sweep een
      # PRODUCTIEBUILD nodig heeft (nonce-gedrag verschilt) — dat had dáár een
      # tweede build gekost. Chromium hier is de goedkope kant.
      #
      # ⚠️ Het risico is niet de kosten maar de HANG: op 18-08 bleef
      # `playwright install` drie keer uren staan. Dat is afgedekt en die
      # bescherming is hier één-op-één overgenomen uit de e2e-job:
      #   · cache op de playwright-versie, dus normaal geen download
      #   · installatie ALLEEN bij een cache-miss
      #   · `retry-with-timeout.sh 600 1` eromheen — harde bovengrens 10 min
      #   · apt laten wachten op locks in plaats van erop stuk te lopen
      # Slechtste geval is dus ~10 min bovenop de ~9 die deze job kost, tegen
      # een limiet van 30.
      - name: Playwright-versie
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Browsercache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: apt laten wachten op locks
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          echo 'DPkg::Lock::Timeout "180";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99lock-timeout

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: scripts/ci/retry-with-timeout.sh 600 1 npx playwright install --with-deps chromium

      # `<html lang>` tegen de ECHTE productieserver die we hier net gebouwd
      # hebben. Deze bewaker is gebouwd nadat elke bezoeker `lang="en"` kreeg op
      # een Nederlandse pagina (#335, changelog #484) — en draaide daarna nergens,
      # omdat hij een server én een browser vroeg.
      #
      # Fase 1 vraagt alleen de server en dekt precies de bug: wat de proxy en de
      # root layout uitsturen. Fase 2 (ná hydratie, DocumentLangSync) vraagt een
      # chromium-binary; die staat er sinds 19-08 en dus draait fase 2 mee.
      #
      # ⚠️ Fase 2 was tot 19-08 STUK, en dat is bijna ongemerkt aangehaakt. Zijn
      # navigatie-scenario's gebruikten `history.pushState`, wat `usePathname()`
      # in Next 16.2.9 niet bijwerkt — drie scenario's faalden dus ongeacht het
      # gedrag van de component en bewezen niets. Gerepareerd naar een echte klik
      # op een next/link (#435). Twee scenario's melden zich luid als overgeslagen
      # omdat er geen link van de app-shell naar /marketing of /brandmd is; dat is
      # een grens van wat er kán gebeuren, geen dekkingsgat.
      #
      # De neppe DATABASE_URL is dezelfde als bij de build: de publieke routes die
      # fase 1 ophaalt raken de database niet. Het klantpagina-scenario is de enige
      # tak die dat wél doet, en die slaat de bewaker luid over zonder LP_PATH.
      #
      # De bewaker is zelf-discriminerend: hij verwacht "nl" op sommige routes en
      # "en" op andere. Zou de taalresolutie naar één constante ontsporen, dan
      # vallen er per definitie checks om — een groene run kan niet betekenen dat
      # hij niets meet.
      - name: Taalattribuut op de gebouwde server
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          BETTER_AUTH_SECRET: "ci-build-secret-not-real"
          BETTER_AUTH_URL: "http://localhost:3000"
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/marketing/pricing && break
            sleep 1
          done
          # Geen exit-code-gedoe: de stap draait met `bash -e`, dus een falende
          # bewaker breekt hier meteen af. De achtergrondserver hoeft niet netjes
          # gestopt: de runner ruimt de job op.
          SMOKE_BROWSER=1 BASE_URL=http://localhost:3000 npm run smoke:document-lang-browser

      # De CSP-sweep draaide in géén enkele workflow, terwijl hij de enige
      # automatische bescherming is onder de enforce-flip van 18-08 (ADR
      # 2026-08-18, PR #294). De reden was dat hij build + database + chromium
      # leek te vragen; die drie samen heeft geen enkele job.
      #
      # GEMETEN: van de 15 checks vragen er NEGEN geen van drieën. De vier
      # policy-checks en de vijf nonce-integriteitschecks gaan via Playwrights
      # `request`-fixture — pure HTTP. Gedraaid met PLAYWRIGHT_BROWSERS_PATH naar
      # een lege map en een neppe DATABASE_URL: 9 passed in 2,1s.
      #
      # Sinds 19-08 staat er chromium, dus de vijf violation-checks draaien mee:
      # 14 van de 15. De vijftiende ("ingelogde app-shell") blijft eruit — die
      # vraagt een GESEEDE database om in te loggen, en die heeft deze job niet.
      # Gemeten: met een neppe DATABASE_URL faalt hij op `sign-in faalde`, niet
      # op een CSP-violation.
      - name: CSP-policy, nonce-integriteit en violations
        env:
          E2E_DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          BETTER_AUTH_SECRET: "ci-build-secret-not-real"
        run: npm run test:csp -- --grep-invert "ingelogde app-shell"

  e2e:
    runs-on: ubuntu-latest
    # Zie de toelichting bij `check`. Normale duur is 3-5 min; 25 laat ruimte
    # voor de drie installatiepogingen hieronder zonder ooit uren te blijven staan.
    timeout-minutes: 25
    services:
      postgres:
        # pgvector-image: het schema heeft vector-kolommen, dus `prisma db push`
        # (in e2e/global-setup.ts) vereist de vector-extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: branddock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Naam moet "_test" bevatten (e2e/global-setup.ts safety-guard).
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/branddock_test
      SEED_CONFIRM: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # De browserdownload liep op 2026-08-18 drie keer vast bij drie
      # verschillende sessies (30, 30 en 93 minuten), altijd op deze stap.
      # Twee maatregelen: bij een cache-hit slaan we de download helemaal over,
      # en anders draait hij met een tijdslimiet plus hertes zodat een netwerkhik
      # een tijdelijke fout wordt in plaats van een blokkade.
      - name: Playwright-versie bepalen
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Browsercache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Laat apt WACHTEN op een bezette lock in plaats van erop stuk te lopen.
      # Gemeten 2026-08-19 (run 32223950965): `playwright install-deps` faalde
      # drie keer op "Could not get lock /var/lib/apt/lists/lock ... held by
      # process 3285 (apt-get)" terwijl in datzelfde log de andere apt-get
      # gewoon doorliep. De runner draait bij het opstarten zijn eigen
      # apt-taken; wij komen er middenin. Dit lost de klasse op, de backoff in
      # retry-with-timeout.sh is het vangnet eronder.
      - name: apt laten wachten op locks
        run: |
          echo 'DPkg::Lock::Timeout "180";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99lock-timeout

      # ⚠️ Alleen bij een cache-MISS, en zonder hertes. `--with-deps` draait apt,
      # en een pakketbeheer-transactie is niet veilig af te kappen: een afgebroken
      # apt laat een staat achter waarin de volgende poging meteen faalt. Gemeten
      # op 2026-08-19 — drie pogingen, de eerste afgekapt, de andere twee stuk.
      # De job-timeout hierboven blijft de vangnet voor een echte hang.
      #
      # Bij een cache-hit draaien we GEEN apt. De ubuntu-latest-runner brengt de
      # bibliotheken die chromium nodig heeft zelf al mee; dat is hier getoetst
      # doordat de e2e-suite groen draait zonder deze stap. Dat scheelt niet alleen
      # tijd: de drie hangs van 2026-08-18 zaten allemaal op een stap die apt
      # draaide, dus dit haalt de vermoedelijke oorzaak zélf weg in plaats van
      # alleen de download eromheen.
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: scripts/ci/retry-with-timeout.sh 600 1 npx playwright install --with-deps chromium

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d branddock_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # global-setup doet prisma db push + seed; de webServer boot `npm run dev`
      # op poort 3001 met de test-DB. De critical-flow raakt GEEN echte AI (checkt
      # alleen dat de AI-Exploration-knop zichtbaar is) → geen AI-keys nodig.
      - name: Run critical-flow e2e
        run: npm run test:e2e -- --grep "Critical Flow"
        env:
          CI: "true"

      # De zeven bewakers die een échte database nodig hebben. Ze staan hier en
      # niet in `check`, want deze job heeft al een postgres draaien én
      # global-setup heeft het schema gepusht en geseed.
      #
      # NA de e2e-suite, niet ervoor: een deel muteert (smoke:lp-retention wist
      # rijen, smoke:review-drift-reset zet review-statussen terug). Ervoor draaien
      # trekt de fixtures onder de tests vandaan.
      #
      # De seed is de reden dat dit werkt. Op een lege database komt een deel van
      # deze bewakers groen terug zónder iets te toetsen — smoke:context-priority
      # ging van "0 toetsen" naar 9 zodra er data stond. Zie run-db-guards.sh.
      - name: DB-bewakers
        run: scripts/ci/run-db-guards.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/branddock_test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
