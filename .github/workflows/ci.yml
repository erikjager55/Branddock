name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Zonder deze regel geldt GitHub's standaard van 360 minuten. Een stap die
    # hangt in plaats van faalt blokkeert een PR dan zes uur en ziet er intussen
    # uit als "nog niet groen" — niet als storing. Normale duur is 6-7 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 22 vereist door promptfoo transitive dep file-type@22.0.1.
          # Tevens consistent met lokale dev (Node 22+ lockfile-resolution).
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit
        env:
          # Sinds 2026-08-15 past ook de KALE `tsc --noEmit` niet meer in Node's
          # default ~4GB-heap: de brandstyle-stack (#255-#259) duwde 'm eroverheen
          # en de stap viel om met `Ineffective mark-compacts near heap limit`
          # (exit 134). Lokaal viel dat niet op — macOS schaalt de heap mee met
          # het beschikbare RAM, de runner niet.
          #
          # Dezelfde druk verklaart de Vercel-preview die op "Running TypeScript"
          # 45 minuten hing en in een timeout liep: geen typefout, geen trage
          # branch (koud type-checken duurt ~35s), maar geheugen.
          #
          # Runner heeft 16GB, dus 8GB is ruim en consistent met de build-stap.
          #
          # GEMETEN 2026-08-19 (koud, piek-RSS via `/usr/bin/time -l`): de volledige
          # type-check piekt op 4,95 GB, en de app alléén al op 4,12 GB — beide boven
          # Node's default van ~4 GB. Deze bump is dus het eindantwoord, geen TODO.
          # Er is GEEN dominant bestand: het duurste geval leverde na versmalling
          # -2,1% instantiaties. De massa is een brede optelsom, met de gegenereerde
          # Prisma-client als grootste enkele post (451k regels = 37% van alle
          # definitieregels). Volledige meting: tasks/done/build-heap-investigation.md.
          NODE_OPTIONS: "--max-old-space-size=8192"

      - run: npm run lint

      # Bewaakt dat elke kleur-utility die de code gebruikt ook echt gegenereerd
      # wordt. src/index.css was tot 18-08 een bevroren artefact; 358 klassen
      # renderden stil niets. ADR 2026-08-18-tailwind-bronpijplijn.
      - run: npm run smoke:css-utilities -- --strict

      # Deterministisch, key-loos en ~2s: bewaakt de regels achter `<html lang>`,
      # die server en client delen. Zie tasks/done/static-rendering-regressie.md.
      - run: npm run smoke:document-lang

      - run: npm run build
        env:
          # These env vars must match the required fields in src/lib/env-validation.ts
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          BETTER_AUTH_SECRET: "ci-build-secret-not-real"
          BETTER_AUTH_URL: "http://localhost:3000"
          # Next's build-TS-fase overschrijdt Node's default ~4GB-heap sinds de
          # webpage-builder-rework. De bump blijft nodig — GEMETEN, niet aangenomen.
          #
          # Hypothese tot 18-08 (stond hier als "type-versmalling is de echte
          # oplossing"): de anonieme structurele inferentie over de
          # 22-component-registry. Die is met #295 weg — `buildSpikePuckConfig`
          # heeft nu een benoemd retourtype. Experiment #302 haalde deze bump er
          # daarna af en de stap viel alsnog om, in exact dezelfde fase:
          #
          #   Running TypeScript ...
          #   Mark-Compact 4028.2 (4130.1) -> 4013.4 (4130.9) MB
          #   FATAL ERROR: Ineffective mark-compacts near heap limit
          #
          # De registry-inferentie was dus NIET de oorzaak (of niet de enige).
          #
          # GEMETEN 2026-08-19: zie de check-stap hierboven. Kort — 4,95 GB koude
          # piek, geen dominant bestand, bump is het eindantwoord. ⚠️ Meet je dit
          # zelf na: verwijder ÉLKE *.tsbuildinfo eerst (incremental staat aan, warm
          # meten geeft 15k instantiaties i.p.v. 9,3M) en gebruik piek-RSS, niet
          # `Memory used` uit --extendedDiagnostics — dat is een momentopname ná GC
          # en bewoog tijdens de meting de verkeerde kant op.
          # Runner heeft 16GB.
          NODE_OPTIONS: "--max-old-space-size=8192"

  e2e:
    runs-on: ubuntu-latest
    # Zie de toelichting bij `check`. Normale duur is 3-5 min; 25 laat ruimte
    # voor de drie installatiepogingen hieronder zonder ooit uren te blijven staan.
    timeout-minutes: 25
    services:
      postgres:
        # pgvector-image: het schema heeft vector-kolommen, dus `prisma db push`
        # (in e2e/global-setup.ts) vereist de vector-extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: branddock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Naam moet "_test" bevatten (e2e/global-setup.ts safety-guard).
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/branddock_test
      SEED_CONFIRM: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # De browserdownload liep op 2026-08-18 drie keer vast bij drie
      # verschillende sessies (30, 30 en 93 minuten), altijd op deze stap.
      # Twee maatregelen: bij een cache-hit slaan we de download helemaal over,
      # en anders draait hij met een tijdslimiet plus hertes zodat een netwerkhik
      # een tijdelijke fout wordt in plaats van een blokkade.
      - name: Playwright-versie bepalen
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Browsercache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: scripts/ci/retry-with-timeout.sh 300 3 npx playwright install --with-deps chromium

      # De cache bevat de browser, niet de OS-pakketten die Playwright nodig
      # heeft. Bij een hit halen we daarom alleen die deps op — dat is apt-werk
      # van seconden, geen download van honderden MB's.
      - name: Playwright systeem-deps (bij cache-hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: scripts/ci/retry-with-timeout.sh 180 3 npx playwright install-deps chromium

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d branddock_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # global-setup doet prisma db push + seed; de webServer boot `npm run dev`
      # op poort 3001 met de test-DB. De critical-flow raakt GEEN echte AI (checkt
      # alleen dat de AI-Exploration-knop zichtbaar is) → geen AI-keys nodig.
      - name: Run critical-flow e2e
        run: npm run test:e2e -- --grep "Critical Flow"
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
